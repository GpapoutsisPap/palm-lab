[project]
name = "palm-lab"
# The version lives in src/palm_lab/version.py only; see [tool.hatch.version].
dynamic = ["version"]
description = "Gesture-controlled shortcut launcher for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Giwrgos Papoutsis" }]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.0",
    "pywebview>=5.0",
    # The notification-area icon; Windows only, like the rest of the window.
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyinstaller>=6.10",
]

[project.scripts]
palm-lab = "palm_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/palm_lab/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/palm_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=palm_lab --cov-report=term-missing"

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pystray", "pystray.*"]
ignore_missing_imports = true
