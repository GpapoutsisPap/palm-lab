[project]
name = "palm-lab"
version = "0.1.0"
description = "Gesture-controlled shortcut launcher for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Giwrgos Papoutsis" }]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palm_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=palm_lab --cov-report=term-missing"
