name: Release

# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds the
# Windows installer and publishes it as a GitHub Release, with that version's
# CHANGELOG.md section as the notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # needed to create the Release and upload the installer

env:
  PYTHONUTF8: "1" # so the notes survive being redirected to a file on Windows

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      # Runs first so a wrong tag or a missing changelog entry fails in seconds.
      - name: Check the tag and write the release notes
        run: uv run python scripts/release_notes.py "${{ github.ref_name }}" > release-notes.md

      - name: Run tests
        run: uv run pytest

      - name: Download the hand model
        run: >
          curl.exe --fail --location --output src/palm_lab/assets/hand_landmarker.task
          https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the app and the installer
        run: uv run python scripts/build.py --installer

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = "dist/palm-lab-setup-$($tag.TrimStart('v')).exe"
          gh release create $tag $installer --title "palm-lab $tag" --notes-file release-notes.md
